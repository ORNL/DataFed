---
stages:
    - build

include:
    - local: .gitlab/common.yml

build-python-client:
    extends: .docker_build_script
    stage: build
    variables:
        PROJECT: "datafed"
        COMPONENT: "python-client"
        GIT_STRATEGY: clone
        DOCKER_FILE_PATH: "python/datafed_pkg/docker/Dockerfile"
        DATAFED_HARBOR_REGISTRY: "$REGISTRY" # needed by c_harbor_artifact_count
        BUILD_INTERMEDIATE: "FALSE"
    tags:
        - docker
    rules:
        - changes:
              - python/**/*
              - common/**/*
              - CMakeLists.txt
              - cmake/**/*
              - .gitlab-ci.yml
          when: on_success

retag-image:
    extends: .docker_retag_image
    stage: build
    variables:
        PROJECT: "datafed"
        COMPONENT: "python-client"
        GIT_STRATEGY: clone
        DATAFED_HARBOR_REGISTRY: "$REGISTRY" # needed by c_harbor_artifact_count
        BUILD_INTERMEDIATE: "FALSE"
    tags:
        - docker
    rules:
        - changes:
              - python/**/*
              - common/**/*
              - CMakeLists.txt
              - cmake/**/*
              - .gitlab-ci.yml
          when: never
        - when: on_success
