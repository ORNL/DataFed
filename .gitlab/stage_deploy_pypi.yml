# GitLab CI configuration for deploying DataFed Python package to PyPI
#
# This job uses the pre-built python-client Docker image and deploys it to PyPI using twine.
# The version numbers are automatically determined from cmake/Version.cmake during the build stage.
#
# Required GitLab CI/CD Variables:
# - PYPI_USERNAME: PyPI username (or __token__ for API token auth)
# - PYPI_PASSWORD: PyPI password or API token
#
# Optional Variables:
# - DATAFED_PYPI_REPO: PyPI package name (defaults to "datafed")
# - PYPI_PRERELEASE: If set to "true", append pre-release identifier (default: "true" for manual job)

.deploy_pypi_base:
    stage: deploy-pypi-package
    before_script:
        - BRANCH_LOWER=$(echo "$CI_COMMIT_REF_NAME" | tr '[:upper:]' '[:lower:]')
        - docker login "${REGISTRY}" -u "${HARBOR_USER}" -p "${HARBOR_DATAFED_GITLAB_CI_REGISTRY_TOKEN}"
    script:
        - BRANCH_LOWER=$(echo "$CI_COMMIT_REF_NAME" | tr '[:upper:]' '[:lower:]')
        - DOWNSTREAM_SHA=$( git submodule status ./external/DataFedDependencies/ | awk '{print $1}' )
        - DOWNSTREAM_SHA=${DOWNSTREAM_SHA#-}
        - mkdir -p dist

        # If PYPI_PRERELEASE is true, rebuild package with pre-release version
        - |
            if [ "${PYPI_PRERELEASE:-true}" = "true" ]; then
              echo "Building package with pre-release identifier (rc${CI_PIPELINE_IID})..."

              # Modify Version.cmake to add pre-release identifier
              sed -i "s/set(DATAFED_PYTHON_CLIENT_RELEASE_TYPE \"\")/set(DATAFED_PYTHON_CLIENT_RELEASE_TYPE \"rc\")/" cmake/Version.cmake
              sed -i "s/set(DATAFED_PYTHON_CLIENT_PRE_RELEASE_IDENTIFER \"\")/set(DATAFED_PYTHON_CLIENT_PRE_RELEASE_IDENTIFER \"${CI_PIPELINE_IID}\")/" cmake/Version.cmake

              # Build with pre-release version using existing Dockerfile
              docker build \
                --build-arg DEPENDENCIES="${REGISTRY}/datafed/dependencies:$DOWNSTREAM_SHA" \
                -f python/datafed_pkg/docker/Dockerfile \
                -t datafed-python-client-prerelease:latest \
                .

              # Extract packages
              docker run --rm -v "$(pwd)/dist:/output" datafed-python-client-prerelease:latest sh -c "cp /dist/* /output/"

              # Restore Version.cmake to original state
              git checkout cmake/Version.cmake
            else
              echo "Deploying as full release (using pre-built image)..."
              docker pull "${REGISTRY}/datafed/python_client-${BRANCH_LOWER}:latest"
              docker run --rm -v "$(pwd)/dist:/output" "${REGISTRY}/datafed/python_client-${BRANCH_LOWER}:latest" sh -c "cp /dist/* /output/"
            fi

        # Verify packages exist
        - ls -lh dist/

        # Upload to PyPI using twine
        - |
            docker run --rm \
              -v "$(pwd)/dist:/dist" \
              -e PYPI_USERNAME="${PYPI_USERNAME}" \
              -e PYPI_PASSWORD="${PYPI_PASSWORD}" \
              -e DATAFED_PYPI_REPO="${DATAFED_PYPI_REPO:-datafed}" \
              "${REGISTRY}/datafed/python_client-${BRANCH_LOWER}:latest" \
              sh -c "twine upload --non-interactive --username \$PYPI_USERNAME --password \$PYPI_PASSWORD /dist/*"
    artifacts:
        paths:
            - dist/
        expire_in: 1 week
    tags:
        - docker

# Manual deployment job - can be triggered via button in GitLab UI
deploy:pypi:manual:
    extends: .deploy_pypi_base
    needs:
        - job: run-python-client-build-job
    when: manual
    rules:
        - when: manual

