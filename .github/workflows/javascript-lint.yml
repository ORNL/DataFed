name: JavaScript Linter
on: push
jobs:
    lint-javascript:
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout the repository
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  submodules: true

            # Step 2: Set up Node.js environment
            - name: Load dependency versions
              id: versions
              run: |
                  source external/DataFedDependencies/scripts/dependency_versions.sh
                  echo "version=${DATAFED_NODE_VERSION}" >> "$GITHUB_OUTPUT"
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ steps.versions.outputs.version }}

            # Step 3: Instal ESLint and run
            - name: Install ESLint
              run: |
                  npm init -y
                  npm install eslint@^9 @babel/eslint-parser@latest eslint-define-config globals eslint-plugin-jsdoc --save
                  npx eslint "**/*.js"

            # Step 4: Report status
            - name: Complete
              run: echo "Linting completed successfully!"
