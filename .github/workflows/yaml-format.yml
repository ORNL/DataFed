name: Yaml Formatter
on: push
jobs:
    format-yaml:
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout the repository
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  submodules: true

            # Step 2: Set up Node.js environment
            - name: Load dependency versions
              id: versions
              run: |
                  source external/DataFedDependencies/scripts/dependency_versions.sh
                  echo "version=${DATAFED_NODE_VERSION}" >> "$GITHUB_OUTPUT"
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ steps.versions.outputs.version }}

            # Step 3: Install Prettier and ESLint globally
            - name: Install Prettier
              run: |
                  npm install -g prettier

            # Step 4: Run Prettier to format code
            - name: Run prettier
              run: |
                  prettier "**/*.yml" --write
                  git diff
                  git reset --hard
                  prettier --check "**/*.yml"

            # Step 5: Report status
            - name: Complete
              run: echo "Formatting completed successfully!"
