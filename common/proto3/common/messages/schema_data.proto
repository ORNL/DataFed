syntax = "proto3";

package sdms;

option cc_enable_arenas = true;

message SchemaData {
    string id = 1;
    uint32 ver = 2;
    bool depr = 3;
    uint32 cnt = 4;
    bool ref = 5;
    string own_id = 6;
    string own_nm = 7;
    string desc = 8;
    bool pub = 9;
    string def = 10;
    repeated SchemaData uses = 11;
    repeated SchemaData used_by = 12;
}
