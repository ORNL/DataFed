// Envelope message wrapping all DataFed protocol messages
// Use has_*() methods in C++ to check which message type is present
//
// Example C++ usage:
//   sdms::Envelope env;
//   if (env.has_version_request()) {
//       // Handle version request
//   } else if (env.has_record_create_request()) {
//       // Handle record creation
//       auto& req = env.record_create_request();
//   }

