syntax = "proto3";

package SDMS;

import "enums/encryption.proto";

option cc_enable_arenas = true;

message DataGetRequest {
    repeated string id = 1;
    string path = 2;
    Encryption encrypt = 3;
    bool orig_fname = 4;
    bool check = 5;
    string collection_id = 6;
    string collection_type = 7;
}
